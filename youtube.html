
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RomyStream — YouTube Zone</title>
<!-- youtube.html: secțiunea YouTube a RomyLivePlus. Citește lista din youtubezone.js;
     adaugi/ștergi colecții doar acolo. Logica de redare e aceeași ca în filme.html (ExtraZone). -->
<style>
:root{--bg:#05070f;--panel:#0b1020;--neon:#22d3ee;--violet:#8b5cf6;--text:#e5e7eb;--muted:#94a3b8;--focus:#22d3ee}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,Segoe UI,Arial}
body{background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:20;background:#020617;border-bottom:1px solid rgba(34,211,238,.15)}
header .wrap{display:flex;gap:.75rem;align-items:center;padding:1rem 1.5rem;flex-wrap:wrap}
header h1{flex:1;font-weight:800;min-width:180px}
header h1 span{color:var(--neon)}
header input,select{background:var(--panel);color:var(--text);border:1px solid rgba(139,92,246,.25);padding:.55rem .7rem;border-radius:12px;height:42px}

.btn-extrazone {
  background: linear-gradient(135deg, var(--violet), var(--neon));
  color: #020617 !important;
  font-weight: 700;
  border-radius: 12px;
  padding: 0 .9rem;
  height: 42px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  font-size: 0.85rem;
  transition: transform 0.15s;
}

main{padding:2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1.25rem;align-items:start}
.card{background:#020617;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s,outline .1s;outline:2px solid transparent;position:relative}
.card:hover{transform:translateY(-6px) scale(1.03)}
.card img{width:100%;height:270px;display:block;object-fit:cover;background:#020617}
.card .meta{padding:.75rem}
.badge{font-size:.75rem;color:var(--neon)}
.pagination{display:flex;justify-content:center;gap:.75rem;padding:1.5rem 0 2.5rem}
button{background:linear-gradient(135deg,var(--violet),var(--neon));color:#020617;border:none;border-radius:14px;padding:.45rem .8rem;cursor:pointer;transition:transform .15s,box-shadow .15s,outline .1s;outline:2px solid transparent}
button.ghost{background:transparent;color:var(--text);border:1px solid rgba(34,211,238,.25);height:42px}

/* STIL SPECIAL PENTRU SERVERUL ACTIV CURENT */
button.ghost.active-server {
  border: 1px solid var(--neon) !important;
  color: var(--neon) !important;
  background: rgba(34, 211, 238, 0.15) !important;
}

.modal{position:fixed;inset:0;background:rgba(2,6,23,.9);display:none;justify-content:center;align-items:center;z-index:30}
.modal-box{background:#020617;width:96%;max-width:1200px;border-radius:22px;max-height:92vh;overflow:auto;padding:1rem;position:relative}
.close{position:absolute;top:.6rem;right:.6rem;z-index:5;width:44px;height:44px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;color:#fff;background:rgba(139,92,246,.25);border:1px solid rgba(34,211,238,.35);border-radius:50%;transition:transform .15s,background .15s,outline .1s;outline:2px solid transparent}
.close:hover{background:rgba(34,211,238,.35)}
.player-wrap iframe{width:100%;height:440px;border-radius:18px;border:1px solid rgba(34,211,238,.2);transition:outline .1s,box-shadow .1s}
.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem;margin-top:1rem}
.episode{cursor:pointer;border-radius:14px;overflow:hidden;background:#020617;border:1px solid rgba(34,211,238,.15);transition:transform .15s,outline .1s;outline:2px solid transparent}
.episode span{display:block;padding:.8rem;font-size:.8rem;text-align:center;font-weight:600}
.details-wrap{padding-right:56px}
.details-wrap p{color:var(--muted);font-size:0.92rem;margin:0.5rem 0 1rem 0;line-height:1.4}
:focus{outline:none}

/* BORDURA DE FOCUS ACTUALIZATĂ CU VARIABILA --FOCUS */
.nav-focus{outline:3px solid var(--focus) !important;outline-offset:2px;box-shadow:0 0 0 4px rgba(34,211,238,.25);transform:scale(1.04);border-radius:14px}
.card.nav-focus,.episode.nav-focus,.btn-extrazone.nav-focus{transform:translateY(-4px) scale(1.03)}
#prev.nav-focus,#next.nav-focus{outline:3px solid var(--focus) !important;outline-offset:3px;box-shadow:0 0 0 5px rgba(34,211,238,.35),0 0 18px rgba(34,211,238,.55) !important;transform:scale(1.08);border-radius:14px}
.hint{text-align:center;color:var(--muted);font-size:.72rem;padding:.25rem 0 .75rem}
.player-wrap{position:relative}
.player-wrap iframe.nav-focus{outline:4px solid var(--focus) !important;outline-offset:3px;box-shadow:0 0 0 6px rgba(34,211,238,.4),0 0 24px rgba(34,211,238,.6) !important;border-radius:18px}
.player-wrap.player-mode iframe{outline:4px solid var(--focus) !important;outline-offset:3px;box-shadow:0 0 0 6px rgba(34,211,238,.45),0 0 28px rgba(34,211,238,.7) !important;border-radius:18px}
#playerModeBadge{display:none;position:absolute;top:8px;left:8px;z-index:6;background:rgba(2,6,23,.9);color:#ffffff;border:1px solid rgba(255,255,255,.7);border-radius:10px;padding:.35rem .6rem;font-size:.72rem;font-weight:700;letter-spacing:.02em}
.player-wrap.player-mode #playerModeBadge{display:block}
.player-hint{text-align:center;color:var(--muted);font-size:.74rem;padding:.5rem 0 .25rem}

.card.serial-special {
  border: 2px solid var(--neon);
  box-shadow: 0 0 15px rgba(34, 211, 238, 0.3);
}
.card.serial-special b {
  color: var(--neon);
}

.modal-box.html-fullscreen {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  max-width: 100vw !important;
  height: 100vh !important;
  max-height: 100vh !important;
  background: #000 !important;
  z-index: 9999 !important;
  border-radius: 0 !important;
  padding: 0 !important;
  margin: 0 !important;
  overflow: hidden !important;
}
.modal-box.html-fullscreen .player-wrap iframe {
  height: 100vh !important;
  border-radius: 0 !important;
  border: none !important;
}
.modal-box.html-fullscreen .details-wrap,
.modal-box.html-fullscreen .player-hint,
.modal-box.html-fullscreen #episodes,
.modal-box.html-fullscreen .close,
.modal-box.html-fullscreen #playerModeBadge {
  display: none !important;
}
.btn-fs {
  background: var(--neon) !important;
  color: #020617 !important;
  font-weight: bold;
  margin: 5px 0 10px 0;
  display: inline-block;
}

.film-container {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 0.8rem;
  background: #090d1a;
  padding: 0.6rem;
  border-radius: 16px;
  border: 1px solid rgba(34, 211, 238, 0.1);
  align-items: center;
}
.film-container img {
  width: 100%;
  height: 70px;
  border-radius: 10px;
  object-fit: cover;
  display: block;
}

.ep-desc {
  display: block;
  font-size: 0.72rem;
  color: var(--muted);
  font-weight: normal;
  padding: 0 0.8rem 0.8rem 0.8rem;
  margin-top: -0.4rem;
  line-height: 1.3;
  text-align: left;
}

.watched-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: #10b981;
  color: #020617;
  font-weight: bold;
  font-size: 0.72rem;
  padding: 2px 6px;
  border-radius: 6px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  z-index: 5;
}
.episode.watched span::after {
  content: " ✔ Vizionat";
  color: #10b981;
  font-weight: bold;
  font-size: 0.72rem;
  margin-left: 8px;
  display: inline-block;
}

/* ===== AUTOPLAY: notificare trecere la urmatorul videoclip ===== */
#autoplayToast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%) translateY(18px);
  background: rgba(3, 10, 24, 0.95);
  border: 1px solid rgba(34, 211, 238, 0.55);
  color: #e2f6ff;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 0.88rem;
  font-weight: 600;
  max-width: 90vw;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 99999;
  box-shadow: 0 8px 26px rgba(0, 0, 0, 0.6);
}
#autoplayToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.btn-autoplay {
  background: transparent;
  border: 1px solid rgba(34, 211, 238, 0.45);
  color: var(--neon);
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 0.78rem;
  font-weight: 700;
  margin: 0 0 10px 8px;
  cursor: pointer;
}
.btn-autoplay.off { border-color: rgba(239, 68, 68, 0.5); color: #fca5a5; }
.yt-status { font-size: 10px; color: #9ca3af; margin: 0 0 10px 6px; opacity: 0.85; }

/* ===== YouTube Zone (youtube.html) ===== */
main{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.card .meta b{display:block;color:#fff;font-size:.92rem;line-height:1.25}
.card .count{font-size:.68rem;color:var(--muted);margin-top:.2rem}
.state{grid-column:1/-1;padding:20px;color:var(--muted);text-align:center}
.state.err{color:#ef4444}
.zone-search{width:100%;max-width:420px;margin:0 0 10px 0;background:var(--panel);color:var(--text);border:1px solid rgba(139,92,246,.25);padding:.55rem .7rem;border-radius:12px;height:42px;display:block}
.film-container img{background:#020617}
#episodes.episodes{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
@media (max-width:640px){#episodes.episodes{grid-template-columns:1fr}}
.ext-tag{font-size:.62rem;color:var(--neon);border:1px solid rgba(34,211,238,.4);border-radius:6px;padding:0 5px;margin-left:6px;font-weight:700}
@media (max-width:640px){main{padding:1rem;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.8rem}.card img{height:210px}.player-wrap iframe{height:240px}}

</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Romy<span>Stream</span></h1>
    <button class="btn-extrazone" id="btnZone" tabindex="0">YouTube Zone</button>
    <select id="section" tabindex="0" aria-label="Secțiune">
      <option value="youtube" selected>YouTube</option>
      <option value="filme">Filme &amp; Seriale</option>
    </select>
  </div>
</header>

<div class="hint">Folosește săgețile telecomenzii pentru navigare, OK pentru selecție, OK pe player pentru a-l acționa, X sau Back pentru închidere.</div>

<main id="main"></main>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox">
    <div class="close" id="close" role="button" tabindex="0" aria-label="Inchide">✕</div>
    <div id="details" class="details-wrap"></div>
    <div class="player-wrap" id="player"></div>
    <div id="episodes" class="episodes"></div>
  </div>
</div>

<script>

/* ===================== YouTube Zone =====================
   Lista principala: youtubezone.js -> window.dateExtraZoneItems = [{id,title,badge,img,jsUrl}, ...]
   Adaugi/editezi colectii DOAR in youtubezone.js; pagina asta nu trebuie modificata.
   Fiecare jsUrl: window.dateCeva = `<div class="item"><img src=".."><a href="..">Titlu</a><em>Descriere</em></div>...`
   (aceeasi logica ca openScriptBasedShow din filme.html). */
const YOUTUBEZONE_URL = 'https://raw.githubusercontent.com/ilicaromeo-cloud/APKK/refs/heads/main/youtubezone.js';
const FALLBACK_POSTER = 'https://img.magnific.com/premium-photo/abstract-digital-music-notes-floating-colorful-virtual-space_963421-21393.jpg'';
const ZONE_CACHE_MS = 5 * 60 * 1000;

let lastCard = null;
let modalOpen = false;
const main = document.getElementById('main');
const modal = document.getElementById('modal');
const modalBox = document.getElementById('modalBox');
const details = document.getElementById('details');
const player = document.getElementById('player');
const episodes = document.getElementById('episodes');
const closeBtn = document.getElementById('close');
const btnZone = document.getElementById('btnZone');
const section = document.getElementById('section');

function markAsWatched(id) {
  let watched = JSON.parse(localStorage.getItem('romy_watched_history') || '[]');
  if (!watched.includes(id)) { watched.push(id); localStorage.setItem('romy_watched_history', JSON.stringify(watched)); }
}
function isWatched(id) { return JSON.parse(localStorage.getItem('romy_watched_history') || '[]').includes(id); }
function verifyAllWatched(ids) { return !!ids && ids.length > 0 && ids.every(id => isWatched(id)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function withT(url) { return url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now(); }
// Acelasi id ca in filme.html, deci marcajul "Vizionat" e comun cu ExtraZone (pe acelasi domeniu).
function episodeId(titlu, ep) { return `show-${encodeURIComponent(titlu)}-${encodeURIComponent(ep.nume || ep.url)}`; }

/* Fisierele colectiilor pot folosi ACELASI nume de variabila (ex. window.dateInsulaIubiriiReuniuni),
   deci le incarcam strict pe rand: incarcare -> citire -> golire, apoi urmatorul. */
let zoneQueue = Promise.resolve();
const zoneData = {};
function dataKeys() { return Object.keys(window).filter(k => /^date/i.test(k) && k !== 'dateExtraZoneItems' && typeof window[k] === 'string' && window[k]); }
function loadZoneScript(url, fresh) {
  const hit = zoneData[url];
  if (!fresh && hit && Date.now() - hit.at < ZONE_CACHE_MS) return Promise.resolve(hit.list);
  const job = zoneQueue.then(() => new Promise(resolve => {
    dataKeys().forEach(k => { window[k] = null; });
    const s = document.createElement('script');
    s.src = withT(url); s.async = true;
    s.onload = () => {
      const key = dataKeys()[0];
      const raw = key ? window[key] : '';
      if (key) window[key] = null;
      s.remove();
      if (raw) { const list = parseZoneHtml(raw); zoneData[url] = { at: Date.now(), list }; resolve(list); return; }
      fallbackZoneText(url).then(resolve);
    };
    s.onerror = () => { s.remove(); fallbackZoneText(url).then(resolve); };
    document.head.appendChild(s);
  }));
  zoneQueue = job.then(() => {}, () => {});
  return job;
}
// Daca fisierul colectiei are o greseala de sintaxa, luam HTML-ul dintre backtick-uri direct din text.
function fallbackZoneText(url) {
  return fetchText(url).then(text => {
    const a = text.indexOf('`'), b = text.lastIndexOf('`');
    if (a < 0 || b <= a) return null;
    const list = parseZoneHtml(text.slice(a + 1, b));
    zoneData[url] = { at: Date.now(), list };
    return list;
  }).catch(() => null);
}
function parseZoneHtml(raw) {
  const doc = new DOMParser().parseFromString(raw, 'text/html');
  const items = doc.querySelectorAll('.item');
  const out = [];
  if (items.length > 0) {
    items.forEach(item => {
      const link = item.querySelector('a'); if (!link || !link.getAttribute('href')) return;
      const img = item.querySelector('img'); const em = item.querySelector('em');
      out.push({ nume: link.textContent.trim(), url: link.getAttribute('href').trim(), imagine: img ? img.getAttribute('src') : '', descriere: em ? em.textContent.trim() : '' });
    });
    out.reverse();   // ca in filme.html: cele mai noi primele
  } else {
    doc.querySelectorAll('a').forEach(link => { const href = link.getAttribute('href'); if (!href) return; out.push({ nume: link.textContent.trim(), url: href.trim(), imagine: '', descriere: '' }); });
  }
  return out;
}

let zonesCache = null;
let zoneListWarning = '';
/* Parser tolerant: citeste {id,title,badge,img,jsUrl} din text fara sa execute JS.
   Folosit cand youtubezone.js are o greseala de sintaxa (ex. '' in loc de ') si browserul nu-l poate rula. */
function parseZoneListText(text) {
  const clean = text.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, '');
  const out = [];
  (clean.match(/\{[^{}]*\}/g) || []).forEach(block => {
    const f = {};
    const re = /([A-Za-z_]\w*)\s*:\s*(['"`])((?:\\.|(?!\2)[^\\])*)\2/g; let m;
    while ((m = re.exec(block))) f[m[1]] = m[3].replace(/\\(.)/g, '$1').trim();
    if (f.title && /^https?:\/\//i.test(f.jsUrl || '')) out.push({ id: f.id || f.jsUrl, title: f.title, badge: f.badge || '', img: /^https?:\/\//i.test(f.img || '') ? f.img : '', jsUrl: f.jsUrl });
  });
  const seen = {};
  return out.filter(z => !seen[z.id] && (seen[z.id] = true));
}
function fetchText(url) {
  return fetch(withT(url), { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); });
}
function runScript(url, onError) {
  return new Promise(resolve => {
    const s = document.createElement('script');
    let syntaxErr = '';
    const catcher = ev => { if (ev.filename && ev.filename.indexOf(url) === 0) { syntaxErr = `${ev.message} (linia ${ev.lineno})`; } };
    window.addEventListener('error', catcher);
    s.src = withT(url);
    s.onload = () => { window.removeEventListener('error', catcher); s.remove(); resolve({ ok: true, syntaxErr }); };
    s.onerror = () => { window.removeEventListener('error', catcher); s.remove(); resolve({ ok: false, syntaxErr }); };
    document.head.appendChild(s);
  });
}
async function loadZoneList(fresh) {
  if (zonesCache && !fresh) return zonesCache;
  zoneListWarning = '';
  window.dateExtraZoneItems = null;
  const res = await runScript(YOUTUBEZONE_URL);
  let list = Array.isArray(window.dateExtraZoneItems) ? window.dateExtraZoneItems.filter(z => z && z.jsUrl && z.title) : null;
  if (!list || !list.length) {
    // scriptul nu a rulat (eroare de sintaxa) -> il citim ca text
    try {
      const parsed = parseZoneListText(await fetchText(YOUTUBEZONE_URL));
      if (parsed.length) {
        list = parsed;
        if (res.syntaxErr || !res.ok) zoneListWarning = `Atenție: youtubezone.js are o greșeală de sintaxă${res.syntaxErr ? ' — ' + res.syntaxErr : ''}. Lista a fost citită în mod tolerant; corectează fișierul.`;
      }
    } catch (e) { /* fetch blocat (alt domeniu / offline) */ }
    if ((!list || !list.length) && res.syntaxErr) zoneListWarning = `youtubezone.js are o greșeală de sintaxă: ${res.syntaxErr}.`;
  }
  if (!list) return res.ok ? [] : null;
  zonesCache = list;
  return zonesCache;
}

function updateCardCompletion(card, zone) {
  if (!card) return;
  loadZoneScript(zone.jsUrl).then(list => {
    const count = card.querySelector('.count');
    if (count) count.textContent = list ? `${list.length} ${list.length === 1 ? 'intrare' : 'intrări'}` : 'Colecție indisponibilă';
    const done = list && verifyAllWatched(list.map(ep => episodeId(zone.title, ep)));
    const badge = card.querySelector('.watched-badge');
    if (done && !badge) card.insertAdjacentHTML('afterbegin', `<span class="watched-badge">✔ Vizionat</span>`);
    if (!done && badge) badge.remove();
  });
}

async function renderZones(fresh) {
  main.innerHTML = "<div class='state'>Se încarcă YouTube Zone...</div>";
  const zones = await loadZoneList(fresh);
  if (!zones) { main.innerHTML = "<div class='state err'>Nu s-a putut încărca youtubezone.js.</div>"; return; }
  if (!zones.length) { main.innerHTML = `<div class='state${zoneListWarning ? ' err' : ''}'>${esc(zoneListWarning || 'youtubezone.js nu conține colecții.')}</div>`; return; }
  main.innerHTML = zoneListWarning ? `<div class='state err'>${esc(zoneListWarning)}</div>` : '';
  zones.forEach(zone => {
    const card = document.createElement('div');
    card.className = 'card serial-special'; card.tabIndex = 0;
    card.innerHTML = `<img src='${esc(zone.img || FALLBACK_POSTER)}' alt='' loading='lazy'><div class='meta'><b>${esc(zone.title)}</b><div class='badge'>${esc(zone.badge || '')}</div><div class='count'>…</div></div>`;
    card.onclick = () => openZone(zone, card);
    main.appendChild(card);
    updateCardCompletion(card, zone);
  });
  if (!modalOpen) { const first = main.querySelector('.card'); if (first) setFocus(first); }
}

function openZone(zone, card) {
  const titlu = zone.title;
  lastCard = card || null; modalOpen = true; window.__modalOpen = true; modal.style.display = 'flex';
  episodes.innerHTML = '<div style="padding:20px; color:var(--neon);">Se descarcă episoadele...</div>';
  modalBox.classList.remove('html-fullscreen'); scrollToPlayer();
  details.innerHTML = `<h2>${esc(titlu)}</h2><p>${esc(zone.badge || 'Vizionare online.')}</p>` +
    `<button class="btn-fs" id="fsToggleBtn" tabindex="0">📺 ECRAN COMPLET</button>` +
    `<button class="btn-autoplay" id="autoplayToggleBtn" tabindex="0">⏭ AUTOPLAY: PORNIT</button>`;
  document.getElementById('fsToggleBtn').onclick = () => toggleHtmlFullscreen();
  const autoplayBtn = document.getElementById('autoplayToggleBtn');
  const paintAutoplayBtn = () => { autoplayBtn.textContent = AUTOPLAY_YOUTUBE ? '⏭ AUTOPLAY: PORNIT' : '⏭ AUTOPLAY: OPRIT'; autoplayBtn.classList.toggle('off', !AUTOPLAY_YOUTUBE); };
  paintAutoplayBtn();
  autoplayBtn.onclick = () => { window.__autoplayToggle(); paintAutoplayBtn(); };
  player.innerHTML = ''; resetAutoplay();
  setTimeout(() => { if (modalOpen) setFocus(document.getElementById('fsToggleBtn')); }, 60);

  loadZoneScript(zone.jsUrl, true).then(list => {
    if (!modalOpen || lastCard !== (card || null)) return;   // utilizatorul a inchis/schimbat intre timp
    if (!list) { episodes.innerHTML = '<div style="padding:20px; color:#ef4444;">Eroare structură date.</div>'; return; }
    if (!list.length) { episodes.innerHTML = '<div style="padding:20px; color:var(--muted);">Colecția nu conține episoade.</div>'; return; }
    episodes.innerHTML = '';
    if (list.length > 30) {
      const search = document.createElement('input');
      search.className = 'zone-search'; search.placeholder = `Caută în ${list.length} intrări…`; search.tabIndex = 0;
      search.oninput = () => {
        const q = search.value.trim().toLowerCase();
        episodes.querySelectorAll('.film-container').forEach(c => { c.style.display = !q || c.dataset.q.includes(q) ? '' : 'none'; });
      };
      details.appendChild(search);
    }
    const autoplayItems = [];
    list.forEach((ep, idx) => {
      const container = document.createElement('div'); container.className = 'film-container';
      container.dataset.q = `${ep.nume} ${ep.descriere}`.toLowerCase();
      container.innerHTML = `<img src="${esc(ep.imagine || zone.img || FALLBACK_POSTER)}" alt="" loading="lazy">`;
      const el = document.createElement('div'); el.className = 'episode'; el.tabIndex = 0;
      const epId = episodeId(titlu, ep);
      if (isWatched(epId)) el.classList.add('watched');
      el.innerHTML = `<span>${esc(ep.nume)}${isYouTubeUrl(ep.url) ? '' : '<b class="ext-tag">EXTERN</b>'}</span>`;
      if (ep.descriere) el.innerHTML += `<span class="ep-desc">${esc(ep.descriere)}</span>`;
      el.onclick = () => {
        markAsWatched(epId); el.classList.add('watched');
        updateCardCompletion(card, zone);
        autoplayIndex = idx; ytMuteRetry = false;
        const existentIframe = player.querySelector('iframe'); if (existentIframe) existentIframe.remove();
        player.insertBefore(createPlayerIframe(ep.url, true), player.firstChild); scrollToPlayer();
      };
      autoplayItems.push({ url: ep.url, el: el, epId: epId, nume: ep.nume });
      container.appendChild(el); episodes.appendChild(container);
    });
    registerAutoplayList(autoplayItems, () => updateCardCompletion(card, zone));
    player.insertBefore(createPlayerIframe(list[0].url), player.firstChild);
  });
}

function injectFullscreenAttributes(iframe) {
  iframe.setAttribute('allowfullscreen', 'true');
  iframe.setAttribute('webkitallowfullscreen', 'true');
  iframe.setAttribute('mozallowfullscreen', 'true');
  iframe.setAttribute('msallowfullscreen', 'true');
  iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');
}

function isDirectVideo(url) {
  if (!url) return false;
  const urlLower = url.trim().toLowerCase();
  return urlLower.includes('.m3u8') || urlLower.includes('.mp4') || urlLower.includes('.mkv') || urlLower.includes('.avi') || urlLower.includes('.mp3');
}

/* ===================== AUTOPLAY: urmatorul videoclip (YouTube) =====================
   Trecerea la urmatorul videoclip YouTube foloseste DOUA mecanisme, ca sa functioneze
   si daca WebView-ul aplicatiei nu livreaza mesajele iframe-ului YouTube:
   1) parametrul playlist=<id-uri> in URL-ul YouTube -> playerul YouTube trece SINGUR,
      fara JavaScript, la urmatorul videoclip YouTube din lista afisata;
   2) mesajele playerului (postMessage: onStateChange / infoDelivery) -> pagina isi
      sincronizeaza lista (toast "Autoplay", marcaj "Vizionat", indexul curent).
   Butonul "AUTOPLAY: PORNIT/OPRIT" opreste mecanismul 2 si trecerea fortata. */
let AUTOPLAY_YOUTUBE = true;     // porneste automat urmatorul videoclip YouTube
let autoplayList = [];           // [{url, el, epId, nume}] in ordinea afisata
let autoplayIndex = -1;          // indexul videoclipului care ruleaza acum
let autoplayLock = 0;            // anti-declansare dubla la acelasi final
let autoplayOnAdvance = null;    // callback (ex: reimprospatare badge "Vizionat")
let ytHandshakeTimer = null;     // mesajul de "listening" catre iframe-ul YouTube
let ytIframe = null;             // iframe-ul YouTube curent
let ytCurrentVideoId = '';       // id-ul videoclipului YouTube care ruleaza acum
let ytMsgCount = 0;              // diagnostic: cate mesaje a trimis playerul YouTube
let ytLastState = null;          // ultima stare raportata de player (1 = reda)
let ytSawPlaying = false;        // playerul a inceput efectiv redarea acestui videoclip
let ytMaxTime = 0;               // cel mai mare currentTime raportat pentru videoclipul curent
let ytEndTimer = null;           // verificare dupa "terminat": a trecut playerul singur?
let ytWatchTimer = null;         // verificare "a pornit redarea?" dupa trecerea automata
let ytMuteRetry = false;         // o singura reincercare cu sunet oprit
let ytStatusText = '';
let ytCapTimer = null;           // reaplicarea "subtitrari oprite" (modulul captions se incarca tarziu)
let ytCapSends = 0;              // diagnostic: cate comenzi "subtitrari oprite" s-au trimis

function isYouTubeUrl(url) {
  return !!url && /(?:youtube\.com|youtube-nocookie\.com)\/(?:embed|v)\/?/i.test(String(url).trim());
}

function ytVideoId(url) {
  const m = String(url || '').match(/(?:youtube\.com|youtube-nocookie\.com)\/(?:embed|v)\/([A-Za-z0-9_-]{6,})/i);
  return m ? m[1] : '';
}

/* Id-urile YouTube de la videoclipul curent pana la finalul listei afisate.
   Playerul YouTube le reda singur, pe rand, fara sa depinda de vreun mesaj. */
function ytPlaylistFor(url) {
  const id = ytVideoId(url);
  if (!id || autoplayList.length < 2) return '';
  const idx = autoplayList.findIndex(it => ytVideoId(it.url) === id);
  if (idx < 0) return '';
  const ids = [];
  for (let i = idx; i < autoplayList.length && ids.length < 50; i++) { const v = ytVideoId(autoplayList[i].url); if (v) ids.push(v); }
  return ids.length > 1 ? ids.join(',') : '';
}

function withYouTubeParams(url, autoplay, mute) {
  const extra = ['enablejsapi=1', 'playsinline=1', 'rel=0', 'cc_load_policy=0'];
  if (autoplay) extra.push('autoplay=1');
  if (mute) extra.push('mute=1');
  let out = String(url).trim();
  if (!/[?&]playlist=/.test(out)) { const pl = ytPlaylistFor(out); if (pl) extra.push('playlist=' + pl); }
  const missing = extra.filter(p => !new RegExp('[?&]' + p.split('=')[0] + '=').test(out));
  if (!missing.length) return out;
  return out + (out.includes('?') ? '&' : '?') + missing.join('&');
}

function stopYtHandshake() {
  if (ytHandshakeTimer) { clearInterval(ytHandshakeTimer); ytHandshakeTimer = null; }
}

// Fara mesajul asta, iframe-ul YouTube nu trimite niciun eveniment catre pagina.
function startYtHandshake(iframe) {
  stopYtHandshake();
  if (!iframe) return;
  const ping = () => { try { iframe.contentWindow.postMessage('{"event":"listening","id":"romy-yt","channel":"widget"}', '*'); } catch (_) {} };
  iframe.addEventListener('load', ping);
  ping();
  let ticks = 0;
  ytHandshakeTimer = setInterval(() => {
    ticks++; ping();
    if (ticks === 40) { clearInterval(ytHandshakeTimer); ytHandshakeTimer = setInterval(ping, 4000); }
  }, 250);
}

function ytCommand(iframe, func, args) {
  if (!iframe) return;
  try { iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args || [] }), '*'); } catch (_) {}
}

/* Subtitrarea pornea singura: playerul restaureaza preferinta de captions la fiecare
   videoclip. Comanda se trimite dupa ce playerul e gata si se reaplica periodic
   (modulul captions se initializeaza asincron). Nu scoatem modulul din UI, doar
   golim pista activa, ca utilizatorul sa poata porni subtitrarea manual daca vrea. */
function ytDisableCaptions(iframe, restart) {
  if (!iframe) return;
  const send = () => {
    ytCommand(iframe, 'setOption', ['captions', 'track', {}]);
    ytCommand(iframe, 'setOption', ['cc', 'track', {}]);
    ytCapSends++;
  };
  send();
  if (restart !== true) return;
  if (ytCapTimer) { clearInterval(ytCapTimer); ytCapTimer = null; }
  let ticks = 0;
  ytCapTimer = setInterval(() => {
    ticks++;
    if (ytIframe !== iframe || ticks > 8) { clearInterval(ytCapTimer); ytCapTimer = null; return; }
    send();
  }, 2000);
}

function createPlayerIframe(url, autoplayNext, forceMute) {
  const iframe = document.createElement('iframe');
  iframe.tabIndex = 0;
  injectFullscreenAttributes(iframe);
  iframe.title = 'Player video';
  iframe.referrerPolicy = 'origin';
  const clean = (url || '').trim();
  const yt = isYouTubeUrl(clean);
  iframe.dataset.src = clean;
  iframe.src = yt ? withYouTubeParams(clean, autoplayNext === true, forceMute === true) : clean;
  if (ytWatchTimer) { clearTimeout(ytWatchTimer); ytWatchTimer = null; }
  if (yt) {
    ytIframe = iframe;
    ytCurrentVideoId = ytVideoId(clean);
    ytLastState = null;
    ytSawPlaying = false;
    ytMaxTime = 0;
    startYtHandshake(iframe);
    ytDisableCaptions(iframe, true);
    if (autoplayNext === true) armYtWatchdog(iframe);
  } else {
    stopYtHandshake();
  }
  return iframe;
}

/* Dupa o trecere automata: daca playerul a raspuns (primim mesaje) dar nu reda
   nimic dupa ~9s, probabil aplicatia blocheaza redarea fara atingere -> reincercam
   o data cu sunetul oprit (redarea cu sunet oprit e permisa de obicei). */
function armYtWatchdog(iframe) {
  const startCount = ytMsgCount;
  ytWatchTimer = setTimeout(() => {
    ytWatchTimer = null;
    if (ytIframe !== iframe) return;                 // s-a incarcat alt videoclip intre timp
    if (ytSawPlaying || ytMaxTime > 0.5) return;     // reda deja (chiar daca acum buffereaza)
    if (ytMsgCount <= startCount) return;            // nu primim mesaje -> nu stim nimic
    retryMutedAutoplay();
  }, 9000);
}

function retryMutedAutoplay() {
  if (ytMuteRetry) return;
  const item = autoplayList[autoplayIndex];
  if (!item || !isYouTubeUrl(item.url)) return;
  ytMuteRetry = true;
  const f = createPlayerIframe(item.url, true, true);
  const old = player.querySelector('iframe');
  if (old && old !== f) old.remove();
  player.insertBefore(f, player.firstChild);
  scrollToPlayer();
  showAutoplayToast('redare automată blocată de aplicație — încerc cu sunet oprit');
  setTimeout(() => {
    const cur = player.querySelector('iframe');
    ytCommand(cur, 'unMute');
    ytCommand(cur, 'setVolume', [100]);
  }, 3000);
}

function registerAutoplayList(items, onAdvance) {
  autoplayList = (items || []).filter(it => it && it.url)
    .map(it => ({ url: it.url, el: it.el || null, epId: it.epId || null, nume: it.nume || '' }));
  autoplayIndex = autoplayList.length ? 0 : -1;   // primul element e deja incarcat in player
  autoplayOnAdvance = onAdvance || null;
  ytMsgCount = 0; ytStatusText = ''; ytMuteRetry = false;
  updateYtStatus();
}

function resetAutoplay() {
  autoplayList = []; autoplayIndex = -1; autoplayOnAdvance = null; stopYtHandshake();
  if (ytEndTimer) { clearTimeout(ytEndTimer); ytEndTimer = null; }
  if (ytWatchTimer) { clearTimeout(ytWatchTimer); ytWatchTimer = null; }
  if (ytCapTimer) { clearInterval(ytCapTimer); ytCapTimer = null; }
  ytIframe = null; ytCurrentVideoId = ''; ytLastState = null;
}

function showAutoplayToast(text) {
  let t = document.getElementById('autoplayToast');
  if (!t) { t = document.createElement('div'); t.id = 'autoplayToast'; document.body.appendChild(t); }
  t.textContent = '▶ Autoplay: ' + (text || 'urmatorul videoclip');
  t.classList.add('show');
  clearTimeout(showAutoplayToast._h);
  showAutoplayToast._h = setTimeout(() => t.classList.remove('show'), 4000);
}

/* Contor vizibil: cate mesaje a trimis playerul YouTube. Daca rămâne 0 in timp ce
   ruleaza un videoclip, aplicatia nu livreaza mesajele (trecerea functioneaza oricum). */
function updateYtStatus() {
  const areYouTube = autoplayList.some(it => isYouTubeUrl(it.url));
  if (!areYouTube) {
    const vechi = document.getElementById('ytStatus');
    if (vechi) vechi.remove();
    ytStatusText = '';
    return;
  }
  const txt = 'YT: ' + ytMsgCount + (ytMsgCount ? '' : ' ⚠');
  if (txt === ytStatusText) return;
  ytStatusText = txt;
  let el = document.getElementById('ytStatus');
  if (!el) {
    el = document.createElement('span');
    el.id = 'ytStatus'; el.className = 'yt-status';
    el.title = 'Mesaje primite de la playerul YouTube. Daca rămâne 0, aplicatia nu livreaza mesajele playerului; trecerea la urmatorul videoclip se face oricum direct de catre player.';
    const btn = document.getElementById('autoplayToggleBtn');
    if (btn && btn.parentNode) btn.parentNode.insertBefore(el, btn.nextSibling);
    else if (typeof details !== 'undefined' && details) details.appendChild(el);
    else return;
  }
  el.textContent = txt;
}

function markItemWatched(i) {
  const item = autoplayList[i];
  if (!item || !item.el) return;
  if (item.epId) markAsWatched(item.epId);
  item.el.classList.add('watched');
}

function ytItemIndexForVideoId(vid) {
  if (!vid) return -1;
  for (let i = 0; i < autoplayList.length; i++) { if (ytVideoId(autoplayList[i].url) === vid) return i; }
  return -1;
}

/* Playerul YouTube a trecut singur la alt videoclip din lista -> sincronizam pagina. */
function syncAutoplayFromPlayer(vid) {
  const i = ytItemIndexForVideoId(vid);
  if (i < 0 || i === autoplayIndex) return;
  markItemWatched(autoplayIndex);
  autoplayIndex = i;
  ytCurrentVideoId = vid;
  ytDisableCaptions(ytIframe, true);
  markItemWatched(i);
  if (ytEndTimer) { clearTimeout(ytEndTimer); ytEndTimer = null; }
  if (typeof autoplayOnAdvance === 'function') { try { autoplayOnAdvance(); } catch (_) {} }
  if (!AUTOPLAY_YOUTUBE) { ytCommand(ytIframe, 'pauseVideo'); return; }   // autoplay oprit
  showAutoplayToast(autoplayList[i].nume);
}

function playAutoplayItem(i, auto) {
  const item = autoplayList[i];
  if (!item) return;
  autoplayIndex = i;
  ytMuteRetry = false;
  if (ytEndTimer) { clearTimeout(ytEndTimer); ytEndTimer = null; }
  markItemWatched(i);
  const existentIframe = player.querySelector('iframe'); if (existentIframe) existentIframe.remove();
  player.insertBefore(createPlayerIframe(item.url, auto === true), player.firstChild);
  scrollToPlayer();
  if (typeof autoplayOnAdvance === 'function') { try { autoplayOnAdvance(); } catch (_) {} }
  if (auto === true) showAutoplayToast(item.nume);
}

function autoplayNextVideo() {
  if (!AUTOPLAY_YOUTUBE || !autoplayList.length) return;
  let i = autoplayIndex + 1;
  while (i < autoplayList.length && !isYouTubeUrl(autoplayList[i].url)) i++;   // doar videoclipuri YouTube
  if (i >= autoplayList.length) return;   // nu mai exista alt videoclip YouTube dupa
  playAutoplayItem(i, true);
}

window.__autoplayNext = autoplayNextVideo;
window.__autoplayToggle = (v) => { AUTOPLAY_YOUTUBE = (v === undefined) ? !AUTOPLAY_YOUTUBE : !!v; return AUTOPLAY_YOUTUBE; };
window.__autoplayState = () => ({ on: AUTOPLAY_YOUTUBE, index: autoplayIndex, msgs: ytMsgCount, current: ytCurrentVideoId, lastState: ytLastState, capOff: ytCapSends, items: autoplayList.map(i => ({ nume: i.nume, url: i.url })) });

/* Playerul YouTube trimite JSON. Unele versiuni trimit obiecte JS fara ghilimele
   ({event:"onStateChange",info:0}), deci nu ne bazam doar pe JSON.parse. */
function parseYtMessage(raw) {
  const s = String(raw).trim();
  if (!s) return null;
  try { const o = JSON.parse(s); if (o && typeof o === 'object') return o; } catch (_) {}
  const ev = (s.match(/event["']?\s*:\s*["']?([A-Za-z]+)/) || [])[1];
  if (!ev) return null;
  const out = { event: ev, channel: 'widget' };
  const num = (re) => { const m = s.match(re); return m ? Number(m[1]) : null; };
  const st = num(/playerState["']?\s*:\s*(-?\d+)/);
  const infoNum = num(/info["']?\s*:\s*(-?\d+)/);
  if (st !== null) out.info = { playerState: st };
  else if (infoNum !== null) out.info = infoNum;
  const vid = (s.match(/video_id["']?\s*:\s*["']([A-Za-z0-9_-]+)["']/) || [])[1];
  if (vid) { if (!out.info || typeof out.info !== 'object') out.info = {}; out.info.videoData = { video_id: vid }; }
  return out;
}

function looksLikeYtEvent(d) {
  const ev = String((d && d.event) || '');
  return ev === 'infoDelivery' || ev === 'initialDelivery' || ev === 'onReady' ||
         ev === 'onStateChange' || ev === 'onError' || ev === 'onPlaybackQualityChange' ||
         ev === 'onApiChange' || ev === 'onFullscreenChange' || ev === 'alreadyInitialized';
}

window.addEventListener('message', (e) => {
  let data = e.data;
  let fromPlayer = false;
  try { fromPlayer = !!(ytIframe && e.source && e.source === ytIframe.contentWindow); } catch (_) {}
  if (typeof data === 'string') { data = parseYtMessage(data); if (!data) return; }
  if (!data || typeof data !== 'object') return;
  if (!fromPlayer) {
    // WebView-ul poate raporta origin gol / file:// / null -> acceptam daca mesajul arata ca un eveniment YouTube
    const origin = String(e.origin || '');
    const originOk = origin === '' || origin === 'null' || origin === 'file://' || origin.indexOf('youtube') !== -1;
    if (!originOk) return;
    if (!looksLikeYtEvent(data) && data.channel !== 'widget') return;
  }
  ytMsgCount++;
  updateYtStatus();
  if (data.event === 'onReady' || data.event === 'onStateChange' || data.event === 'apiInfoDelivery') {
    ytDisableCaptions(ytIframe, data.event === 'apiInfoDelivery');
  }
  if (!autoplayList.length) return;
  const info = (data.info && typeof data.info === 'object') ? data.info : null;
  if (info && typeof info.playerState === 'number') ytLastState = info.playerState;
  if (data.event === 'onStateChange' && typeof data.info === 'number') ytLastState = data.info;
  if (ytLastState === 1) ytSawPlaying = true;
  if (info && typeof info.currentTime === 'number' && info.currentTime > ytMaxTime) ytMaxTime = info.currentTime;

  // 1) playerul ruleaza deja alt videoclip din lista (a trecut singur mai departe)
  const vid = info && info.videoData && info.videoData.video_id;
  if (vid && ytLastState !== 0 && ytLastState !== 2) syncAutoplayFromPlayer(vid);

  // 2) videoclipul curent s-a terminat
  const ended = (data.event === 'onStateChange' && Number(data.info) === 0) ||
                (data.event === 'infoDelivery' && Number(info && info.playerState) === 0);
  if (!ended) return;
  const now = Date.now();
  if (now - autoplayLock < 3000) return;
  autoplayLock = now;
  markItemWatched(autoplayIndex);
  const vidAtEnd = ytCurrentVideoId;
  if (ytEndTimer) clearTimeout(ytEndTimer);
  ytEndTimer = setTimeout(() => {
    ytEndTimer = null;
    if (!AUTOPLAY_YOUTUBE) return;
    if (ytCurrentVideoId !== vidAtEnd) return;   // playerul a trecut singur mai departe
    autoplayNextVideo();                          // n-a trecut singur -> incarcam noi urmatorul
  }, 2500);
});

function toggleHtmlFullscreen() {
  if (modalBox.classList.contains('html-fullscreen')) {
    modalBox.classList.remove('html-fullscreen');
    setPlayerFlag(false);
  } else {
    modalBox.classList.add('html-fullscreen');
    setPlayerFlag(true);
    enterPlayerMode();
  }
}


function scrollToPlayer() { if (modalBox) modalBox.scrollTop = 0; }

function closeModal(){
  if(!modalOpen)return;
  if(modalBox.classList.contains('html-fullscreen')) { modalBox.classList.remove('html-fullscreen'); setPlayerFlag(false); exitPlayerMode(); return; }
  if(playerMode){exitPlayerMode();return;}
  modalOpen=false; window.__modalOpen=false; modal.style.display='none'; player.innerHTML=''; setPlayerFlag(false); clearFocus(); resetAutoplay();
  if(lastCard){setFocus(lastCard);} else {const f=main.querySelector('.card');if(f)setFocus(f);}
}
window.__closeModal=closeModal;   

let playerMode=false; window.__playerMode=false;
function setPlayerFlag(on){ try{ const target = on ? '#player-on' : '#player-off'; if(location.hash !== target){ history.replaceState(null,'',location.pathname + location.search + target); } }catch(_){} }
function enterPlayerMode(){ const iframe=player.querySelector('iframe'); if(!iframe)return; playerMode=true; window.__playerMode=true; player.classList.add('player-mode'); setPlayerFlag(true); clearFocus(); iframe.focus(); }
function exitPlayerMode(){ if(!playerMode)return; playerMode=false; window.__playerMode=false; player.classList.remove('player-mode'); setPlayerFlag(false); const iframe=player.querySelector('iframe'); if(iframe){setFocus(iframe);} }

function clearFocus(){document.querySelectorAll('.nav-focus').forEach(el=>el.classList.remove('nav-focus'))}
function setFocus(el){ if(!el)return; clearFocus(); el.classList.add('nav-focus'); try{el.focus({preventScroll:true})}catch(_){el.focus()} el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'}); }
function getFocused(){return document.querySelector('.nav-focus')}

function focusables(){
  const scope = modalOpen ? modal : document;
  const sel='a[href],button,select,input,[tabindex]:not([tabindex="-1"]),.card,.episode';
  return [...scope.querySelectorAll(sel)].filter(el=>{ if(el.disabled)return false; if(el.offsetParent===null && el!==document.body)return false; return el.getBoundingClientRect().width>0; });
}

function move(dir){
  const items=focusables(); if(!items.length)return;
  let cur=getFocused(); if(!cur||!items.includes(cur)){setFocus(items[0]);return;}
  const cr=cur.getBoundingClientRect(); const ccx=(cr.left+cr.right)/2, ccy=(cr.top+cr.bottom)/2;
  let best=null,bestScore=Infinity;
  items.forEach(el=>{
    if(el===cur)return; const r=el.getBoundingClientRect(); const cx=(r.left+r.right)/2, cy=(r.top+r.bottom)/2;
    const dx=cx-ccx, dy=cy-ccy;
    let valid=false,primary=0,secondary=0;
    if(dir==='right'){valid=dx>6;primary=dx;secondary=Math.abs(dy);}
    else if(dir==='left'){valid=dx<-6;primary=-dx;secondary=Math.abs(dy);}
    else if(dir==='down'){valid=dy>6;primary=dy;secondary=Math.abs(dy);}
    else if(dir==='up'){valid=dy<-6;primary=-dy;secondary=Math.abs(dx);}
    if(!valid)return; const score=primary+secondary*2; if(score<bestScore){bestScore=score;best=el;}
  });
  if(best)setFocus(best);
}

function activate(){
  const el=getFocused(); if(!el)return;
  if(el.tagName==='IFRAME'){enterPlayerMode();return;} if(el.tagName==='SELECT'||el.tagName==='INPUT'){return;}
  el.dispatchEvent(new MouseEvent('click', {bubbles:true, cancelable:true, view:window}));
}

document.addEventListener('keydown',e=>{
  const k=e.key||'', c=e.keyCode||0;
  const up=k==='ArrowUp'||c===38; const down=k==='ArrowDown'||c===40; const left=k==='ArrowLeft'||c===37; const right=k==='ArrowRight'||c===39;
  const ok=k==='Enter'||k===' '||c===13; const back=k==='Escape'||k==='Backspace'||c===27||c===8;

  const activeEl=document.activeElement;
  if(activeEl && activeEl.tagName==='SELECT'){
    // Nu interceptam tastele cand un dropdown (Filme/Seriale, categorie, gen) e focusat cu telecomanda.
    // Lasam browserul sa deschida/navigheze/inchida select-ul nativ (sageti + OK/Enter), altfel
    // butonul raspundea doar la mouse pentru ca preventDefault() bloca deschiderea nativa.
    return;
  }
  if(activeEl && activeEl.tagName==='INPUT'){
    // In campul de cautare lasam sageata stanga/dreapta sa miste cursorul in text, nu navigarea.
    if(left||right) return;
  }

  if(modalBox.classList.contains('html-fullscreen')) {
    if(back) { e.preventDefault(); modalBox.classList.remove('html-fullscreen'); setPlayerFlag(false); exitPlayerMode(); return; }
    return;
  }
  if(playerMode){ if(back){e.preventDefault();exitPlayerMode();return;} return; }
  if(back){ if(modalOpen){e.preventDefault();closeModal();} return; }
  if(up){e.preventDefault();move('up');} else if(down){e.preventDefault();move('down');}
  else if(left){e.preventDefault();move('left');} else if(right){e.preventDefault();move('right');}
  else if(ok){e.preventDefault();activate();}
},true);

btnZone.onclick = () => { if (!modalOpen) renderZones(true); };
section.onchange = () => { if (section.value === 'filme') location.href = FILME_URL; };
closeBtn.onclick = () => closeModal(); modal.onclick = e => { if (e.target === modal) closeModal(); };
renderZones(false);

</script>
</body>
