<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0b0e13;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100%}
body{padding:14px 16px 40px}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;font-weight:800;color:#1e90ff;letter-spacing:.5px}
h1 span{color:#fff;font-weight:600;font-size:13px;margin-left:6px;opacity:.6}
#search{flex:1;min-width:160px;background:#151a22;border:1px solid #232b36;color:#fff;border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
#search:focus{border-color:#1e90ff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;background:#151a22;border:1px solid #232b36;color:#cfd6e0;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:#1e90ff;border-color:#1e90ff;color:#fff;font-weight:700}
.chip:focus{outline:none;border-color:#1e90ff;box-shadow:0 0 0 2px rgba(30,144,255,.5)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.card{background:#131821;border:1px solid #1e2531;border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer;transition:transform .12s,border-color .12s}
.card:focus,.card:hover{outline:none;border-color:#1e90ff;transform:scale(1.05);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.thumb{width:100%;height:56px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.thumb img{max-width:100%;max-height:56px;object-fit:contain}
.ph{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#1e90ff,#0b4f9e);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.name{font-size:12px;line-height:1.25;color:#e6ebf2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:30px}
.empty{padding:40px 0;text-align:center;color:#8b93a1;font-size:14px}
#pl{position:fixed;inset:0;background:#000;display:none;z-index:99}
#pl.on{display:block}
#pl iframe{width:100%;height:100%;border:0;background:#000}
#bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);z-index:5}
#ttl{font-size:14px;font-weight:700;flex:1;text-shadow:0 1px 3px #000}
#close{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer}
#close:focus{outline:none;border-color:#1e90ff;background:#1e90ff}
#bar{transition:opacity .25s,transform .25s}
#bar.off{opacity:0;transform:translateY(-110%);pointer-events:none}
#hot{position:absolute;top:0;left:0;right:0;bottom:0;z-index:4;display:none;background:transparent;cursor:default}
#pl.on #bar.off ~ #hot{display:block}
#hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:#9aa3b1;transition:opacity .25s}
#hint.off{opacity:0}
footer{margin-top:20px;text-align:center;font-size:11px;color:#5a6474}
</style>

    fr = document.getElementById('fr'), ttl = document.getElementById('ttl'),
    closeBtn = document.getElementById('close'), search = document.getElementById('search'),
    bar = document.getElementById('bar'), hot = document.getElementById('hot'),
    hint = document.getElementById('hint');

function norm(s){return s.toLowerCase().replace(/[\ă\â]/g,'a').replace(/\î/g,'i').replace(/[\ș\ş]/g,'s').replace(/[\ț\ţ]/g,'t');}

['Toate'].concat(CATS).forEach(function(c){
  var b = document.createElement('div');
  b.className = 'chip' + (c === 'Toate' ? ' on' : '');
  b.textContent = c; b.tabIndex = 0;
  b.onclick = function(){ cur = c; [].forEach.call(chips.children, function(x){x.classList.remove('on');}); b.classList.add('on'); render(); };
  b.onkeydown = function(e){ if(e.key === 'Enter' || e.keyCode === 13){ b.click(); } };
  chips.appendChild(b);
});

function render(){
  var nq = norm(q), out = [];
  for (var i = 0; i < CH.length; i++){
    var c = CH[i];
    if (cur !== 'Toate' && c.c.indexOf(cur) < 0) continue;
    if (nq && norm(c.n).indexOf(nq) < 0 && c.s.indexOf(nq) < 0) continue;
    out.push(c);
  }
  grid.innerHTML = '';
  empty.style.display = out.length ? 'none' : 'block';
  var frag = document.createDocumentFragment();
  out.forEach(function(c){
    var d = document.createElement('div');
    d.className = 'card'; d.tabIndex = 0;
    var t = document.createElement('div'); t.className = 'thumb';
    if (c.l){
      var im = document.createElement('img');
      im.loading = 'lazy'; im.src = c.l; im.alt = c.n;
      im.onerror = function(){ t.innerHTML = ''; t.appendChild(phEl(c.n)); };
      t.appendChild(im);
    } else { t.appendChild(phEl(c.n)); }
    var n = document.createElement('div'); n.className = 'name'; n.textContent = c.n;
    d.appendChild(t); d.appendChild(n);
    d.onclick = function(){ play(c); };
    d.onmouseenter = function(){ lastSel = d; };
    d.onfocus = function(){ lastSel = d; };
    d.onkeydown = function(e){ var k = e.keyCode || 0; if(e.key === 'Enter' || e.key === 'Select' || k === 13 || k === 23 || k === 66 || k === 32){ e.preventDefault(); play(c); } };
    frag.appendChild(d);
  });
  grid.appendChild(frag);
}

function phEl(name){
  var p = document.createElement('div'); p.className = 'ph';
  p.textContent = (name || '?').trim().charAt(0).toUpperCase();
  return p;
}

function enterPlayerFullscreen(){
  try {
    if (document.fullscreenElement === pl || document.webkitFullscreenElement === pl) return;
    var request = pl.requestFullscreen || pl.webkitRequestFullscreen || pl.webkitRequestFullScreen;
    if (request) {
      var result = request.call(pl);
      if (result && result.catch) result.catch(function(){});
    }
  } catch(e){}
}

function play(c){
  ttl.textContent = c.n;
  var tvtunSlug = TVTUN[c.s];
  if (tvtunSlug){
    fr.src = 'https://tvtun.com/embed/player/' + tvtunSlug;
  } else {
    fr.src = 'https://www.tvonline24.net/ro/embed/' + c.s;
  }
  pl.classList.add('on');
  window.__modalOpen = true;
  showBar();
  enterPlayerFullscreen();
  try { closeBtn.focus(); } catch(e){}
  try { if (location.hash !== '#player-on') location.hash = 'player-on'; } catch(e){}
}

function closePlayer(){
  stopWatch();
  barOn = true;
  bar.style.display = '';
  hint.style.display = '';
  bar.classList.remove('off');
  hint.classList.remove('off');
  hot.style.display = 'none';
  pl.classList.remove('on');
  fr.src = 'about:blank';
  window.__modalOpen = false;
  try { if (location.hash === '#player-on') location.hash = 'player-off'; } catch(e){}
  return true;
}

window.__closeModal = closePlayer;
closeBtn.onclick = closePlayer;
closeBtn.onkeydown = function(e){ var k = e.keyCode || 0; if(e.key === 'Enter' || e.key === 'Select' || k === 13 || k === 23 || k === 66){ e.preventDefault(); closePlayer(); } };

/* ================= bara: auto-hide dupa 10s de inactivitate ================= */
var HIDE_MS = 10000, barOn = true, lastAct = Date.now(), watchdog = null,
    lastX = -1, lastY = -1;

function playerOpen(){
  return !!window.__modalOpen || pl.classList.contains('on');
}
function showBar(){
  barOn = true;
  lastAct = Date.now();
  bar.style.display = '';
  hint.style.display = '';
  /* forteaza repaint in WebView-urile de Android TV */
  void bar.offsetHeight;
  bar.classList.remove('off');
  hint.classList.remove('off');
  hot.style.display = 'none';
  startWatch();
}
function hideBar(){
  if (!playerOpen()) return;
  barOn = false;
  bar.classList.add('off');
  hint.classList.add('off');
  /* display:none garanteaza dispariția si pe WebView-urile care nu repicteaza opacity peste video */
  bar.style.display = 'none';
  hint.style.display = 'none';
  hot.style.display = 'block';
  try { if (document.activeElement === closeBtn) closeBtn.blur(); } catch(e){}
}
/* watchdog: verifica inactivitatea o data pe secunda (imun la setTimeout pierdut/throttled) */
function startWatch(){
  if (watchdog) return;
  watchdog = setInterval(function(){
    if (!playerOpen()){ stopWatch(); return; }
    if (barOn && (Date.now() - lastAct) >= HIDE_MS) hideBar();
  }, 1000);
}
function stopWatch(){
  if (watchdog){ clearInterval(watchdog); watchdog = null; }
}
function armHide(){ lastAct = Date.now(); startWatch(); }

/* orice activitate reala reafiseaza bara si reseteaza cele 10s */
function bump(){
  if (!playerOpen()) return;
  lastAct = Date.now();
  if (!barOn) showBar(); else startWatch();
}
window.__romyActivity = bump;
window.__romyBarState = function(){
  return JSON.stringify({open: playerOpen(), barOn: barOn, idle: Date.now() - lastAct, watch: !!watchdog});
};

/* mousemove: ignora tremuratul pointerului (air-mouse) sub 6px, altfel bara nu s-ar ascunde niciodata */
document.addEventListener('mousemove', function(e){
  var dx = Math.abs(e.clientX - lastX), dy = Math.abs(e.clientY - lastY);
  if (lastX >= 0 && dx < 6 && dy < 6) return;
  lastX = e.clientX; lastY = e.clientY;
  bump();
}, true);
['mousedown','click','wheel','touchstart','touchmove'].forEach(function(ev){
  document.addEventListener(ev, bump, true);
});
['mousemove','mousedown','click','touchstart','wheel'].forEach(function(ev){
  hot.addEventListener(ev, function(e){ e.stopPropagation(); if (ev !== 'mousemove') e.preventDefault(); showBar(); });
});

/* ================= OK / SELECT de la telecomanda ================= */
var lastSel = null;

document.addEventListener('focusin', function(e){
  var el = e.target;
  if (el && el.closest){ var c = el.closest('.card,.chip'); if (c) lastSel = c; }
}, true);
document.addEventListener('mouseover', function(e){
  var el = e.target && e.target.closest ? e.target.closest('.card,.chip') : null;
  if (el) lastSel = el;
}, true);

function currentTarget(){
  var a = document.activeElement;
  if (a && a.closest){
    var c = a.closest('.card,.chip,#close,#search');
    if (c) return c;
  }
  return lastSel;
}

/* apelata de aplicatie cand se apasa OK/Play pe telecomanda */
function okAction(){
  if (window.__modalOpen){
    if (!barOn){ showBar(); return true; }          /* prima apasare: doar arata bara */
    closePlayer(); return true;                      /* a doua apasare: inchide */
  }
  var el = currentTarget();
  if (!el || el === search) el = lastSel || document.querySelector('.card');
  if (el){
    try { el.focus(); } catch(e){}
    lastSel = (el.classList && (el.classList.contains('card') || el.classList.contains('chip'))) ? el : lastSel;
    el.click();
    return true;
  }
  return false;
}
window.__romyPlayerAction = okAction;
window.__romyOk = okAction;
window.__romySelect = okAction;
window.__romyClick = okAction;

function isOkKey(e){
  var k = e.keyCode || 0;
  if (k === 13 || k === 23 || k === 66 || k === 32 || k === 62 || k === 85 || k === 96 || k === 160) return true;
  if (e.key === 'Enter' || e.key === 'Select' || e.key === ' ' || e.key === 'Spacebar') return true;
  /* OK nemapat pe unele telecomande: keyCode 0 / key nedefinit */
  if (k === 0 && (!e.key || e.key === 'Unidentified')) return true;
  return false;
}

document.addEventListener('keydown', function(e){
  var k = e.keyCode || 0;

  /* BACK / ESC inchide playerul */
  if (k === 4 || k === 27 || e.key === 'Escape' || e.key === 'GoBack' || e.key === 'BrowserBack'){
    if (window.__modalOpen){ closePlayer(); e.preventDefault(); e.stopPropagation(); }
    return;
  }

  bump();

  /* in caseta de cautare lasam tastatura sa lucreze normal */
  if (e.target === search && !window.__modalOpen){
    if (isOkKey(e) && k !== 32){ e.preventDefault(); try{ search.blur(); }catch(_){} 
      var f = lastSel || document.querySelector('.card'); if (f){ try{f.focus();}catch(__){} } }
    return;
  }

  if (isOkKey(e)){
    if (okAction()){ e.preventDefault(); e.stopPropagation(); }
    return;
  }

  /* daca nimic nu e focusat si se apasa o directie, focuseaza primul canal */
  if ((k >= 19 && k <= 22) || (k >= 37 && k <= 40)){
    var a = document.activeElement;
    if (!a || a === document.body || a === document.documentElement){
      var first = lastSel || document.querySelector('.card');
      if (first){ try { first.focus(); } catch(_){} e.preventDefault(); }
    }
  }
}, true);

document.addEventListener('keyup', function(e){ bump(); }, true);

/* focus initial pe primul canal, ca OK sa functioneze imediat */
setTimeout(function(){
  var f = document.querySelector('.card');
  if (f && (document.activeElement === document.body || !document.activeElement)){
    lastSel = f; try { f.focus(); } catch(e){}
  }
}, 350);

search.addEventListener('input', function(){ q = search.value || ''; render(); });
render();
</script>
